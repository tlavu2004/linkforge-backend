spring:
  application:
    name: linkforge-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

rate-limit:
  max-requests: 60
  time-window-seconds: 60

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  admin:
    email: ${ADMIN_EMAIL:admin@linkforge.com}
    password: ${ADMIN_PASSWORD:admin123}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,beans
  endpoint:
    health:
      show-details: always

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: ${VNPAY_URL}
  return-url: ${VNPAY_RETURN_URL}
  api-url: ${VNPAY_API_URL}
  version: "2.1.0"
  command: "pay"

---

# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linkforge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 2000
      pool-name: LinkForge-HikariCP-Dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:noreply@linkforge.com}

logging:
  level:
    com.tlavu.linkforge: DEBUG
    org.hibernate.SQL: DEBUG

---

# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000
      pool-name: LinkForge-HikariCP-Prod
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      username: ${REDIS_USERNAME}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  backend:
    url: ${BACKEND_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM}

vnpay:
  returnUrl: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
