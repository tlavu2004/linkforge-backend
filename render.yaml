# =============================================
# LinkForge Backend — Render Blueprint (IaC)
# =============================================
# Deploy: Connect this repo to Render, or use
#   render blueprint sync in the Render dashboard.
#
# Required: Set env vars in Render Dashboard
#   or use .env.prod as reference.
# =============================================

services:
  - type: web
    name: linkforge-backend
    runtime: docker
    repo: https://github.com/tlavu2004/linkforge-backend
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      # --- Spring Profile ---
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # --- Database (NeonDB / Render PostgreSQL) ---
      - key: DB_URL
        sync: false  # Set manually in Render Dashboard
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # --- Redis (Render Redis / Upstash) ---
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"

      # --- JWT ---
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure value
      - key: JWT_EXPIRATION
        value: "900000"
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: "604800000"

      # --- Server ---
      - key: SERVER_PORT
        value: "8080"

      # --- Frontend URL (CORS & redirect) ---
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel frontend URL

      # --- VNPay ---
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        value: "https://pay.vnpay.vn/vpcpay.html"
      - key: VNPAY_RETURN_URL
        sync: false  # Set to https://your-backend.onrender.com/api/v1/payments/vnpay-return
