# ==========================================================
# LinkForge Backend — Local Development (Docker Compose)
# ==========================================================
# This file is for LOCAL DEVELOPMENT ONLY.
# For production (Render), use render.yaml + .env.prod.
# ==========================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: linkforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linkforge-net

  redis:
    image: redis:alpine
    container_name: linkforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - linkforge-net

  app:
    build: .
    image: ghcr.io/tlavu2004/linkforge-backend:latest
    container_name: linkforge-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/linkforge
      - REDIS_HOST=redis
      - FRONTEND_URL=http://localhost,http://localhost:5173
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linkforge-net

volumes:
  postgres_data:
  redis_data:


networks:
  linkforge-net:
    name: linkforge-net
